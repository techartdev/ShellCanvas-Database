[package]
name = "shellcanvas-database-adapter"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "shellcanvas-device"
path = "src/main.rs"

[dependencies]
base64 = "0.22.1"
chrono = { version = "0.4.42", features = ["serde"] }
futures-util = "0.3.31"
rfd = "0.17.2"
bigdecimal = "0.4.9"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
shellcanvas-adapter-sdk = { path = "../vendor/shellcanvas-adapter-sdk" }
sqlx = { version = "=0.8.6", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "mysql", "sqlite", "chrono", "uuid", "json", "bigdecimal"] }
tiberius = { version = "0.12.3", default-features = false, features = ["tds73", "rustls", "chrono"] }
tokio = { version = "1.47.1", features = ["fs", "net", "sync", "time"] }
tokio-util = { version = "0.7.16", features = ["compat"] }
tempfile = "3.23.0"
uuid = { version = "1.18.1", features = ["v4"] }

sqlx-core = { version = "=0.8.6", default-features = false }

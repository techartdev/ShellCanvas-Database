name: Build Database native connectors

# CI keeps these build artifacts for review. Release only after all platform
# packages and their hashes have been checked together.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-22.04
          - platform: macos-x86_64
            runner: macos-15-intel
          - platform: macos-aarch64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Linux native libraries
        if: matrix.platform == 'linux-x86_64'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libxkbcommon-dev libgtk-3-dev libsqlite3-dev libdbus-1-dev pkg-config
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version
      - name: Build and validate native connector
        run: |
          cargo run --locked --manifest-path vendor/shellcanvas-adapter-sdk/Cargo.toml --bin shellcanvas-adapter -- build adapter dist/adapter-${{ matrix.platform }}
          cargo run --locked --manifest-path vendor/shellcanvas-adapter-sdk/Cargo.toml --bin shellcanvas-adapter -- validate dist/adapter-${{ matrix.platform }}/adapter.json
      - name: Check platform identity
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          root = pathlib.Path('dist') / ('adapter-' + os.environ['PLATFORM'])
          manifest = json.loads((root / 'adapter.json').read_text())
          assert manifest['platform'] == os.environ['PLATFORM']
          assert manifest['version'] == '0.1.1'
          assert (root / manifest['entrypoint']).is_file()
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: database-adapter-${{ matrix.platform }}
          path: dist/adapter-${{ matrix.platform }}/
          if-no-files-found: error
          retention-days: 7

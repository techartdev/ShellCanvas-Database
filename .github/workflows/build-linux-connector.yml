name: Verify Linux Database connector

# A focused Linux build allows retrying a runner-library failure without
# repeating the paid macOS matrix jobs.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Linux native libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libxkbcommon-dev libgtk-3-dev libsqlite3-dev libdbus-1-dev pkg-config
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version
      - name: Build and validate native connector
        run: |
          cargo run --locked --manifest-path vendor/shellcanvas-adapter-sdk/Cargo.toml --bin shellcanvas-adapter -- build adapter dist/adapter-linux-x86_64
          cargo run --locked --manifest-path vendor/shellcanvas-adapter-sdk/Cargo.toml --bin shellcanvas-adapter -- validate dist/adapter-linux-x86_64/adapter.json
      - uses: actions/upload-artifact@v4
        with:
          name: database-adapter-linux-x86_64
          path: dist/adapter-linux-x86_64/
          if-no-files-found: error
          retention-days: 7
